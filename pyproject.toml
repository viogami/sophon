[project]
name = "sophon"
version = "0.1.0"
description = "动漫角色结构化数据目录与后续 RAG 原型"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "FlagEmbedding>=1.3.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
sophon = "sophon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sophon"]
